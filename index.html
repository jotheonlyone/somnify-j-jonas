<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Somnify - Schlafphasen & Schlafrhythmus Tracker</title>
    <meta name="description" content="Intelligenter Schlaftracker im modernen Flat-Design zur Erkennung von Schlafrhythmen und Korrelationen zwischen Gewohnheiten und Tief- bzw. REM-Schlaf." />
    <meta property="og:title" content="Somnify - Schlafphasen & Schlafrhythmus Tracker" />
    <meta property="og:description" content="Intelligenter Schlaftracker im modernen Flat-Design zur Erkennung von Schlafrhythmen und Korrelationen zwischen Gewohnheiten und Tief- bzw. REM-Schlaf." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('somnify_theme') || 'system';
          var isDark = saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-[#0b101b] text-slate-900 dark:text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
